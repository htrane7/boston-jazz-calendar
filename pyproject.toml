[project]
name = "boston-jazz-calendar"
version = "0.1.0"
description = "Collect Boston jazz concerts into one calendar file."
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jazzcal*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
